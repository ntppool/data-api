version: "2"
sql:
  - schema: "schema.sql"
    queries: "query.sql"
    engine: "postgresql"
    strict_order_by: false
    gen:
      go:
        package: "ntpdb"
        out: "ntpdb"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_db_tags: true
        omit_unused_structs: true
        emit_interface: true
        rename:
          servers.Ip: IP
        overrides:
          - column: log_scores.attributes
            go_type: go.ntppool.org/common/types.LogScoreAttributes
          - column: "server_netspeed.netspeed_active"
            go_type: "int"
          - column: "zone_server_counts.netspeed_active"
            go_type: "int"
          - db_type: "bigint"
            go_type: "int"
